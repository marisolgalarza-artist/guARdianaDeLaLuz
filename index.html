<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <title>GUARDIANA DE LA LUZ - AR</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>


<body style="margin:0; overflow:hidden;">


<a-scene

  mindar-image="imageTargetSrc: ./target.mind;"

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false">


  <!-- ========================= -->
  <!-- RECURSOS -->
  <!-- ========================= -->

  <a-assets>

    <!-- VIDEO DE LA ESFERA -->

    <video
      id="videoLuz"
      src="./video_ping_pong.webm"
      loop
      muted
      playsinline
      crossorigin="anonymous">
    </video>

  </a-assets>


  <!-- ========================= -->
  <!-- CÁMARA -->
  <!-- ========================= -->

  <a-camera

    position="0 0 0"

    look-controls="enabled:false">

  </a-camera>


  <!-- ========================= -->
  <!-- PINTURA -->
  <!-- ========================= -->

  <a-entity

    id="target"

    mindar-image-target="targetIndex: 0">


    <!-- ========================= -->
    <!-- VIDEO DE LA ESFERA -->
    <!-- ========================= -->

    <a-plane

      id="videoPlane"

      src="#videoLuz"

      position="0 0 0.05"

      width="1"

      height="1"

      material="
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
        side: double;
      ">

    </a-plane>


    <!-- ========================= -->
    <!-- CONTENEDOR DE PARTÍCULAS -->
    <!-- ========================= -->

    <a-entity
      id="particulas">

    </a-entity>


  </a-entity>


</a-scene>


<script>


/* =========================================
   VIDEO
========================================= */

const target = document.querySelector("#target");

const video = document.querySelector("#videoLuz");


/* =========================================
   CUANDO SE PIERDE LA PINTURA
========================================= */

target.addEventListener(
  "targetLost",
  () => {

    console.log(
      "Pintura perdida"
    );


    /*
      DETENER VIDEO
    */

    video.pause();



  }
);


</script>


</body>

</html>
