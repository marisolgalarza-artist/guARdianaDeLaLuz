<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <title>GUARDIANA DE LA LUZ - AR</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>


<body style="margin:0; overflow:hidden;">


<a-scene

  mindar-image="imageTargetSrc: ./target.mind;"

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false">


  <!-- ========================= -->
  <!-- RECURSOS -->
  <!-- ========================= -->

  <a-assets>

    <!-- VIDEO DE LA ESFERA -->

    <video
      id="videoLuz"
      src="./video_ping_pong.webm"
      loop
      muted
      playsinline
      crossorigin="anonymous">
    </video>

  </a-assets>


  <!-- ========================= -->
  <!-- CÁMARA -->
  <!-- ========================= -->

  <a-camera

    position="0 0 0"

    look-controls="enabled:false">

  </a-camera>


  <!-- ========================= -->
  <!-- PINTURA -->
  <!-- ========================= -->

  <a-entity

    id="target"

    mindar-image-target="targetIndex: 0">


    <!-- ========================= -->
    <!-- VIDEO DE LA ESFERA -->
    <!-- ========================= -->

    <a-plane

      id="videoPlane"

      src="#videoLuz"

      position="0 0 0.05"

      width="1"

      height="1"

      material="
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
        side: double;
      ">

    </a-plane>


    <!-- ========================= -->
    <!-- CONTENEDOR DE PARTÍCULAS -->
    <!-- ========================= -->

    <a-entity
      id="particulas">

    </a-entity>


  </a-entity>


</a-scene>


<script>


/* =========================================
   VIDEO
========================================= */

const target = document.querySelector("#target");

const video = document.querySelector("#videoLuz");


/* =========================================
   CONTENEDOR DE PARTÍCULAS
========================================= */

const particulas =
  document.querySelector("#particulas");


/* =========================================
   CREAR PARTÍCULAS
========================================= */

function crearParticula() {


  const p = document.createElement("a-sphere");


  /*
    POSICIÓN INICIAL

    Las partículas nacen
    alrededor de la esfera.
  */

  const x =
    (Math.random() - 0.5) * 0.35;

  const y =
    (Math.random() - 0.5) * 0.20;

  const z = 0.12;


  p.setAttribute(
    "position",
    `${x} ${y} ${z}`
  );


  /*
    TAMAÑO

    Muy pequeño para que
    parezcan destellos.
  */

  const tamaño =
    0.008 + Math.random() * 0.015;


  p.setAttribute(
    "radius",
    tamaño
  );


  /*
    MATERIAL DORADO
  */

  p.setAttribute(
    "material",
    `
      color: #FFD76A;
      emissive: #FFD76A;
      emissiveIntensity: 2;
      shader: standard;
      transparent: true;
      opacity: 0.85;
    `
  );


  /*
    DURACIÓN

    Cada partícula tarda
    entre 1.5 y 3 segundos.
  */

  const duracion =
    1500 + Math.random() * 1500;


  /*
    ALTURA

    Sube suavemente.
  */

  const altura =
    y + 0.25 + Math.random() * 0.20;


  /*
    MOVIMIENTO VERTICAL
  */

  p.setAttribute(
    "animation__subir",
    `
      property: position;
      to: ${x} ${altura} ${z};
      dur: ${duracion};
      easing: easeOutQuad;
    `
  );


  /*
    DESAPARECER
  */

  p.setAttribute(
    "animation__desaparecer",
    `
      property: material.opacity;
      from: 0.85;
      to: 0;
      dur: ${duracion};
      easing: easeInQuad;
    `
  );


  particulas.appendChild(p);


  /*
    ELIMINAR PARTÍCULA
    CUANDO TERMINA
  */

  setTimeout(() => {

    if (p.parentNode) {

      p.parentNode.removeChild(p);

    }

  }, duracion + 100);

}


/* =========================================
   CREAR GRUPO DE PARTÍCULAS
========================================= */

function iniciarParticulas() {

  /*
    Creamos pocas partículas
    para que el efecto sea elegante.
  */

  for (let i = 0; i < 15; i++) {

    setTimeout(() => {

      crearParticula();

    }, i * 120);

  }


  /*
    Después seguimos generando
    nuevas partículas.
  */

  window.intervaloParticulas =
    setInterval(() => {

      crearParticula();

    }, 350);

}


/* =========================================
   DETENER PARTÍCULAS
========================================= */

function detenerParticulas() {

  clearInterval(
    window.intervaloParticulas
  );


  /*
    Eliminamos las partículas
    existentes.
  */

  while (
    particulas.firstChild
  ) {

    particulas.removeChild(
      particulas.firstChild
    );

  }

}


/* =========================================
   CUANDO SE ENCUENTRA LA PINTURA
========================================= */

target.addEventListener(
  "targetFound",
  () => {

    console.log(
      "Pintura encontrada"
    );


    /*
      REINICIAR VIDEO
    */

    video.currentTime = 0;

    video.play().catch(() => {

      console.log(
        "El navegador necesita interacción."
      );

    });


    /*
      INICIAR PARTÍCULAS
    */

    iniciarParticulas();

  }
);


/* =========================================
   CUANDO SE PIERDE LA PINTURA
========================================= */

target.addEventListener(
  "targetLost",
  () => {

    console.log(
      "Pintura perdida"
    );


    /*
      DETENER VIDEO
    */

    video.pause();


    /*
      DETENER PARTÍCULAS
    */

    detenerParticulas();

  }
);


</script>


</body>

</html>
