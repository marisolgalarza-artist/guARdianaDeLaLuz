
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>La guARdiana de la luz - AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body style="margin:0; overflow:hidden;">

  <a-scene
    mindar-image="imageTargetSrc: ./target.mind;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- VIDEO -->
    <a-assets>

      <video
        id="videoLuz"
        src="./video_ping_pong.webm"
        loop
        muted
        playsinline
        crossorigin="anonymous">
      </video>

    </a-assets>

    <!-- CÁMARA -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- OBJETIVO DE LA PINTURA -->
    <a-entity
      mindar-image-target="targetIndex: 0">

      <!-- VIDEO SOBRE LA PINTURA -->
      <a-plane
        src="#videoLuz"
        position="0 0 0.05"
        width="1"
        height="1"
        material="
          shader: flat;
          transparent: true;
          alphaTest: 0.01;
          side: double;
        ">
      </a-plane>

    </a-entity>

  </a-scene>


  <!-- CONTROL DEL VIDEO -->
  <script>

    const target = document.querySelector(
      '[mindar-image-target]'
    );

    const video = document.querySelector('#videoLuz');

    target.addEventListener('targetFound', () => {

      console.log('PINTURA DETECTADA');

      video.currentTime = 0;

      video.play().catch(error => {
        console.log('No se pudo iniciar automáticamente:', error);
      });

    });

    target.addEventListener('targetLost', () => {

      console.log('PINTURA PERDIDA');

      video.pause();

    });

  </script>

</body>
</html>
